<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">AI_Skills — a Claude Code agent system running the tender and proposal pipeline for SNAgency and AIR (ООО «КСИИ»)</title>
  <desc id="hero-desc">Left: project name and description. Right: the six-stage tender pipeline — 00-source, 01-analysis, 02-estimate, 03-proposal, 04-application, and a cross-cutting review stage — each mapped to the Claude Code agent that runs it.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23.25" fill="none" stroke="#23262E" stroke-width="1.5"/>

  <!-- divider -->
  <line x1="660" y1="48" x2="660" y2="292" stroke="#23262E" stroke-width="1.5"/>

  <!-- title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1.5" fill="#7C9CFF">PERSONAL OPS · TENDER PIPELINE</text>

    <text x="64" y="140" font-size="58" font-weight="700" fill="#F2F0EB">AI_Skills</text>

    <text x="64" y="182" font-size="19" fill="#A9AFBD">One operator, two allied companies — SNAgency</text>
    <text x="64" y="209" font-size="19" fill="#A9AFBD">and AIR (ООО «КСИИ») — running every tender</text>
    <text x="64" y="236" font-size="19" fill="#A9AFBD">from intake to submission as Claude Code agents.</text>

    <text x="64" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#F5A623">6 pipeline stages · 8 specialist agents · 43 skills</text>
  </g>

  <!-- project-native proof: the real tender pipeline, stage → agent -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="690" y="42" font-size="19" fill="#7C9CFF">tenders/&lt;deal&gt;/</text>

    <line x1="702" y1="52" x2="702" y2="276" stroke="#3A4150" stroke-width="1.5"/>

    <!-- 00-source -->
    <line x1="702" y1="65" x2="722" y2="65" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="728" y="54" width="42" height="22" rx="6" fill="#7C9CFF"/>
    <text x="749" y="69" font-size="13" font-weight="700" fill="#0B0D10" text-anchor="middle">00</text>
    <text x="778" y="70" font-size="18" fill="#F2F0EB">source</text>
    <text x="880" y="70" font-size="14" fill="#6B7280">tender-intake</text>

    <!-- 01-analysis -->
    <line x1="702" y1="95" x2="722" y2="95" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="728" y="84" width="42" height="22" rx="6" fill="#7C9CFF"/>
    <text x="749" y="99" font-size="13" font-weight="700" fill="#0B0D10" text-anchor="middle">01</text>
    <text x="778" y="100" font-size="18" fill="#F2F0EB">analysis</text>
    <text x="880" y="100" font-size="14" fill="#6B7280">tender-analyst</text>

    <!-- 02-estimate -->
    <line x1="702" y1="125" x2="722" y2="125" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="728" y="114" width="42" height="22" rx="6" fill="#7C9CFF"/>
    <text x="749" y="129" font-size="13" font-weight="700" fill="#0B0D10" text-anchor="middle">02</text>
    <text x="778" y="130" font-size="18" fill="#F2F0EB">estimate</text>
    <text x="880" y="130" font-size="14" fill="#6B7280">tender-estimate</text>

    <!-- 03-proposal -->
    <line x1="702" y1="155" x2="722" y2="155" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="728" y="144" width="42" height="22" rx="6" fill="#7C9CFF"/>
    <text x="749" y="159" font-size="13" font-weight="700" fill="#0B0D10" text-anchor="middle">03</text>
    <text x="778" y="160" font-size="18" fill="#F2F0EB">proposal</text>
    <text x="880" y="160" font-size="14" fill="#6B7280">tender-deck</text>

    <!-- 04-application -->
    <line x1="702" y1="185" x2="722" y2="185" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="728" y="174" width="42" height="22" rx="6" fill="#7C9CFF"/>
    <text x="749" y="189" font-size="13" font-weight="700" fill="#0B0D10" text-anchor="middle">04</text>
    <text x="778" y="190" font-size="18" fill="#F2F0EB">application</text>
    <text x="880" y="190" font-size="14" fill="#6B7280">tender-docs</text>

    <!-- R — review, cross-cutting -->
    <g opacity="0.85">
      <line x1="702" y1="215" x2="722" y2="215" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="728" y="204" width="42" height="22" rx="6" fill="none" stroke="#F5A623" stroke-width="1.5"/>
      <text x="749" y="219" font-size="13" font-weight="700" fill="#F5A623" text-anchor="middle">R</text>
      <text x="778" y="220" font-size="18" fill="#F2F0EB">review</text>
      <text x="880" y="220" font-size="14" fill="#6B7280">tender-reviewer</text>
    </g>

    <!-- STATUS.md footer note -->
    <line x1="702" y1="246" x2="702" y2="246" stroke="#3A4150" stroke-width="1.5"/>
    <text x="702" y="256" font-size="14" fill="#8B92A0">↳ state for all six lives in one file: STATUS.md</text>
  </g>
</svg>
