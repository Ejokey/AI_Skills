<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">AI_Skills — Personal Ops, Claude Code skill library</title>
  <desc id="hero-desc">A directory tree showing skills grouped by business role: business-analysis, design, marketing, shared, sales, tenders, product-management, and project-management, with skill counts per folder.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23.25" fill="none" stroke="#23262E" stroke-width="1.5"/>

  <!-- divider -->
  <line x1="672" y1="48" x2="672" y2="292" stroke="#23262E" stroke-width="1.5"/>

  <!-- title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#7C9CFF">PERSONAL OPS · CLAUDE CODE</text>

    <text x="64" y="146" font-size="60" font-weight="700" fill="#F2F0EB">AI_Skills</text>

    <text x="64" y="190" font-size="20" fill="#A9AFBD">One operator running eight roles — PM, BA,</text>
    <text x="64" y="218" font-size="20" fill="#A9AFBD">marketing, design, sales, tenders — as versioned</text>
    <text x="64" y="246" font-size="20" fill="#A9AFBD">Claude Code skills.</text>

    <text x="64" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#F5A623">34 skills · 8 roles · scripts/install-skills.sh</text>
  </g>

  <!-- project-native proof: the real skills/ role tree -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="700" y="42" font-size="20" fill="#7C9CFF">skills/</text>

    <line x1="712" y1="52" x2="712" y2="276" stroke="#3A4150" stroke-width="1.5"/>

    <!-- row template: tick + count badge + label -->
    <!-- business-analysis: 9 -->
    <line x1="712" y1="66" x2="732" y2="66" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="738" y="55" width="34" height="22" rx="6" fill="#7C9CFF"/>
    <text x="755" y="70" font-size="14" font-weight="700" fill="#0B0D10" text-anchor="middle">9</text>
    <text x="782" y="71" font-size="20" fill="#F2F0EB">business-analysis</text>

    <!-- design: 9 -->
    <line x1="712" y1="96" x2="732" y2="96" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="738" y="85" width="34" height="22" rx="6" fill="#7C9CFF"/>
    <text x="755" y="100" font-size="14" font-weight="700" fill="#0B0D10" text-anchor="middle">9</text>
    <text x="782" y="101" font-size="20" fill="#F2F0EB">design</text>

    <!-- marketing: 6 -->
    <line x1="712" y1="126" x2="732" y2="126" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="738" y="115" width="34" height="22" rx="6" fill="#7C9CFF"/>
    <text x="755" y="130" font-size="14" font-weight="700" fill="#0B0D10" text-anchor="middle">6</text>
    <text x="782" y="131" font-size="20" fill="#F2F0EB">marketing</text>

    <!-- shared: 6 -->
    <line x1="712" y1="156" x2="732" y2="156" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="738" y="145" width="34" height="22" rx="6" fill="#7C9CFF"/>
    <text x="755" y="160" font-size="14" font-weight="700" fill="#0B0D10" text-anchor="middle">6</text>
    <text x="782" y="161" font-size="20" fill="#F2F0EB">shared</text>

    <!-- sales: 2 -->
    <line x1="712" y1="186" x2="732" y2="186" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="738" y="175" width="34" height="22" rx="6" fill="#7C9CFF"/>
    <text x="755" y="190" font-size="14" font-weight="700" fill="#0B0D10" text-anchor="middle">2</text>
    <text x="782" y="191" font-size="20" fill="#F2F0EB">sales</text>

    <!-- tenders: 2 -->
    <line x1="712" y1="216" x2="732" y2="216" stroke="#3A4150" stroke-width="1.5"/>
    <rect x="738" y="205" width="34" height="22" rx="6" fill="#7C9CFF"/>
    <text x="755" y="220" font-size="14" font-weight="700" fill="#0B0D10" text-anchor="middle">2</text>
    <text x="782" y="221" font-size="20" fill="#F2F0EB">tenders</text>

    <!-- product-management: empty -->
    <g opacity="0.45">
      <line x1="712" y1="246" x2="732" y2="246" stroke="#3A4150" stroke-width="1.5"/>
      <rect x="738" y="235" width="34" height="22" rx="6" fill="none" stroke="#3A4150" stroke-width="1.5"/>
      <text x="755" y="250" font-size="14" fill="#6B7280" text-anchor="middle">—</text>
      <text x="782" y="251" font-size="20" fill="#8B92A0">product-management</text>
    </g>

    <!-- project-management: empty -->
    <g opacity="0.45">
      <line x1="712" y1="276" x2="732" y2="276" stroke="#3A4150" stroke-width="1.5"/>
      <rect x="738" y="265" width="34" height="22" rx="6" fill="none" stroke="#3A4150" stroke-width="1.5"/>
      <text x="755" y="280" font-size="14" fill="#6B7280" text-anchor="middle">—</text>
      <text x="782" y="281" font-size="20" fill="#8B92A0">project-management</text>
    </g>
  </g>
</svg>
